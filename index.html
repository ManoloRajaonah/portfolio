<!DOCTYPE html>
<html lang="fr">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-C24J03ZDKQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-C24J03ZDKQ');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manolo Raj | Portfolio</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #ffffff;
            --text-color: #ffffff;
            --accent-color: rgba(255, 255, 255, 0.4);
            --transition-main: 0.6s cubic-bezier(0.25, 1, 0.3, 1);
            --menu-width: 320px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: padding-left var(--transition-main);
        }

        @media (min-width: 1025px) {
            body:not(.menu-is-closed) { padding-left: var(--menu-width); }
            body.menu-is-closed { padding-left: 0; }
        }

        header, footer {
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        #action-popup {
            position: fixed; bottom: 100px; left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: white; color: black; padding: 12px 25px;
            border-radius: 50px; font-size: 11px; font-weight: 700;
            text-transform: uppercase; text-decoration: none;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            z-index: 2200; opacity: 0; pointer-events: none;
            transition: all 0.4s;
        }
        #action-popup.visible { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
        .software-icons { display: flex; gap: 10px; font-size: 18px; border-left: 1px solid #ddd; padding-left: 12px; }

        .menu-toggle {
            background: none; border: none; color: white;
            cursor: pointer; opacity: 0.6; transition: 0.3s;
            display: flex; align-items: center; gap: 10px;
            text-transform: uppercase; font-size: 11px; letter-spacing: 0.2em;
            z-index: 2100;
        }

        .menu-overlay {
            position: fixed; top: 0; left: 0;
            width: var(--menu-width); height: 100%;
            background: rgba(11, 11, 11, 0.98); backdrop-filter: blur(15px);
            z-index: 2500; transition: transform var(--transition-main); padding: 40px;
            overflow-y: auto; box-sizing: border-box;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }
        .menu-overlay.closed { transform: translateX(-100%); }
        
        .close-menu {
            position: absolute; top: 20px; right: 20px;
            background: none; border: none; color: white;
            font-size: 20px; cursor: pointer; opacity: 0.5;
        }

        .swiper { width: 100%; flex-grow: 1; display: flex; align-items: center; }
        
        .swiper-slide {
            width: 50vw; display: flex; justify-content: center; align-items: center;
            transition: all 0.6s; opacity: 0.15; filter: grayscale(100%);
        }
        .swiper-slide-active { opacity: 1; filter: grayscale(0%); }
        
        .slide-content { width: 100%; background-color: var(--card-bg); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .slide-content img { width: 100%; height: auto; display: block; }

        @media (max-width: 1024px) {
            body { overflow-y: auto; height: auto; padding-left: 0 !important; }
            header {
                position: fixed; top: 0; left: 0; width: 100%; 
                padding: 15px; background: rgba(11,11,11,0.95);
                backdrop-filter: blur(10px); box-sizing: border-box;
            }
            .pdf-link, .social-links, footer, .nav-controls { display: none !important; }
            .swiper { display: block; margin-top: 60px; }
            .swiper-wrapper { display: block; transform: none !important; }
            .swiper-slide { 
                width: 100% !important; opacity: 1 !important; filter: none !important; 
                transform: none !important; margin: 0 !important; display: block;
            }
            .slide-content { box-shadow: none; border-bottom: 0px; }
            .menu-overlay { width: 100%; }
            #action-popup { bottom: 30px; width: 85%; font-size: 10px; }
        }

        .pdf-link {
            color: white; text-decoration: none; font-size: 11px;
            letter-spacing: 0.15em; text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 18px; transition: 0.3s; opacity: 0.7;
            position: absolute; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 8px;
        }
        .menu-overlay ul { list-style: none; padding: 0; margin: 0; }
        .menu-section-title { font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent-color); margin: 25px 0 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; display: block; }
        .menu-overlay li a { color: white; text-decoration: none; font-size: 14px; display: block; padding: 12px 0; opacity: 0.7; transition: 0.3s; font-weight: 300; }
        .nav-controls { display: flex; align-items: center; gap: 30px; position: absolute; left: 50%; transform: translateX(-50%); }
        .arrow-icon { width: 50px; height: 1px; background: white; position: relative; cursor: pointer; opacity: 0.5; }
        .arrow-icon::after { content: ''; position: absolute; right: 0; top: -3px; width: 6px; height: 6px; border-top: 1px solid white; border-right: 1px solid white; transform: rotate(45deg); }
        .arrow-left { transform: scaleX(-1); }
    </style>
</head>
<body id="body">

    <header>
        <button class="menu-toggle" id="toggleBtn">
            <i class="fa-solid fa-list-ul"></i>
            <span>Sommaire</span>
        </button>
        <a href="portfolio_medium.pdf" class="pdf-link" download>
            <i class="fa-solid fa-file-pdf"></i>
            <span>Télécharger PDF</span>
        </a>
        <nav class="social-links">
            <a href="https://www.behance.net/manolorajaonah" target="_blank" style="color:white; margin-left:15px;"><i class="fa-brands fa-behance"></i></a>
            <a href="mailto:manolo.rajaonah@gmail.com" style="color:white; margin-left:15px;"><i class="fa-regular fa-envelope"></i></a>
        </nav>
    </header>

    <nav class="menu-overlay" id="menuOverlay">
        <button class="close-menu" id="closeMenuBtn"><i class="fa-solid fa-xmark"></i></button>
        <div style="text-align: center; margin-bottom: 30px;">
            <img src="logo.png" width="55px" style="opacity: 0.8;">
            <div style="font-size: 9px; letter-spacing: 0.3em; margin-top: 10px; opacity: 0.5;">PORTFOLIO 2026</div>
        </div>
        <ul id="menuList"></ul>
    </nav>

    <a href="#" target="_blank" id="action-popup">
        <span id="popup-text">Action</span>
        <div class="software-icons" id="popup-icons"></div>
    </a>

    <main class="swiper mySwiper">
        <div class="swiper-wrapper" id="slider-wrapper"></div>
    </main>

    <footer>
        <div style="opacity: 0.3; font-size: 10px;">DESIGNER GRAPHIQUE & WEB</div>
        <nav class="nav-controls">
            <div class="arrow-icon arrow-left" id="prevBtn"></div>
            <div id="page-number" style="font-weight: 500; min-width: 80px; text-align: center; font-size: 13px;">01 / 31</div>
            <div class="arrow-icon" id="nextBtn"></div>
        </nav>
        <div style="opacity: 0.3; font-size: 10px;">© 2026 MANOLO RAJ</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const CONFIG = {
            totalSlides: 31,
            baseImgPath: 'images/7cbfec2e-',
            pageActions: {
                26: { text: "Visitez le site", link: "https://manolorajaonah.github.io/portfolio/coiffure/", icons: ['fa-solid fa-globe'] },
                5: { text: "Voir l'animation", link: "https://www.instagram.com/reel/DTrhakigrBd/", icons: ['fa-solid fa-cube', 'fa-solid fa-clapperboard'] },
                8: { text: "Voir l'animation", link: "https://www.instagram.com/p/DK17HBACv7A/", icons: ['fa-solid fa-cube', 'fa-solid fa-clapperboard'] },
                12: { text: "Voir l'animation", link: "https://www.instagram.com/reel/DUL8Nw9gncY/", icons: ['fa-solid fa-cube', 'fa-solid fa-clapperboard'] }
            },
            menuItems: [
                { type: 'title', label: 'MISE EN PAGE & PACKAGING' },
                { type: 'link', label: 'Armona', slide: 5 },
                { type: 'link', label: 'Pochette d’album', slide: 8 },
                { type: 'link', label: 'Jeu de cartes', slide: 12 },
                { type: 'title', label: 'LOGOFOLIO & TATTOOFOLIO' },
                { type: 'link', label: 'Logofolio', slide: 15 },
                { type: 'link', label: 'Tattoofolio', slide: 18 },
                { type: 'title', label: 'AFFICHE & ÉTIQUETTE' },
                { type: 'link', label: 'HIP HOP', slide: 21 },
                { type: 'link', label: 'Brasserie d’Alma', slide: 23 },
                { type: 'title', label: 'WEB' },
                { type: 'link', label: 'Site vitrine Coiffure', slide: 26 },
                { type: 'link', label: 'UI/UX Épicerie & Crèmerie', slide: 28 }
            ]
        };

        const isMobile = window.innerWidth <= 1024;
        const menuOverlay = document.getElementById('menuOverlay');
        const body = document.getElementById('body');

        if (isMobile) menuOverlay.classList.add('closed');

        const wrapper = document.getElementById('slider-wrapper');
        for (let i = 1; i <= CONFIG.totalSlides; i++) {
            const index = i.toString().padStart(2, '0');
            const slide = document.createElement('div');
            slide.className = 'swiper-slide'; slide.id = `slide-${i}`;
            slide.innerHTML = `<article class="slide-content"><img src="${CONFIG.baseImgPath}${index}.png"></article>`;
            wrapper.appendChild(slide);
        }

        const popup = document.getElementById('action-popup');
        function updatePopup(idx) {
            const act = CONFIG.pageActions[idx];
            if (act) {
                popup.href = act.link;
                document.getElementById('popup-text').innerText = act.text;
                document.getElementById('popup-icons').innerHTML = act.icons.map(ic => `<i class="${ic}"></i>`).join('');
                popup.classList.add('visible');
            } else popup.classList.remove('visible');
        }

        if (!isMobile) {
            const swiper = new Swiper(".mySwiper", {
                centeredSlides: true, slidesPerView: "auto", speed: 800, mousewheel: true, keyboard: true,
                on: {
                    slideChange: function () {
                        const idx = this.activeIndex + 1;
                        document.getElementById('page-number').innerText = `${idx.toString().padStart(2, '0')} / ${CONFIG.totalSlides}`;
                        updatePopup(idx);
                    }
                }
            });
            document.getElementById('prevBtn').onclick = () => swiper.slidePrev();
            document.getElementById('nextBtn').onclick = () => swiper.slideNext();
        } else {
            window.addEventListener('scroll', () => {
                const slides = document.querySelectorAll('.swiper-slide');
                let cur = 1;
                slides.forEach((s, i) => {
                    const r = s.getBoundingClientRect();
                    if (r.top < window.innerHeight/2 && r.bottom > window.innerHeight/2) cur = i+1;
                });
                document.getElementById('page-number').innerText = `${cur.toString().padStart(2, '0')} / ${CONFIG.totalSlides}`;
                updatePopup(cur);
            });
        }

        const menuList = document.getElementById('menuList');
        CONFIG.menuItems.forEach(item => {
            const li = document.createElement('li');
            if (item.type === 'title') {
                li.className = 'menu-section-title'; li.textContent = item.label;
            } else {
                const a = document.createElement('a');
                a.href = "#"; a.textContent = item.label;
                a.onclick = (e) => {
                    e.preventDefault();
                    if (isMobile) {
                        const target = document.getElementById(`slide-${item.slide}`);
                        window.scrollTo({ top: target.offsetTop - 70, behavior: 'smooth' });
                        menuOverlay.classList.add('closed');
                    } else {
                        document.querySelector('.mySwiper').swiper.slideTo(item.slide - 1);
                    }
                };
                li.appendChild(a);
            }
            menuList.appendChild(li);
        });

        document.getElementById('toggleBtn').onclick = () => {
            menuOverlay.classList.remove('closed');
            body.classList.remove('menu-is-closed');
        };
        document.getElementById('closeMenuBtn').onclick = () => {
            menuOverlay.classList.add('closed');
            body.classList.add('menu-is-closed');
        };

        window.onresize = () => { if((window.innerWidth <= 1024) !== isMobile) location.reload(); };
    </script>
</body>
</html>
