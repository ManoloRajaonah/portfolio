    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #ffffff;
            --text-color: #ffffff;
            --accent-color: rgba(255, 255, 255, 0.4);
            --transition-main: 0.8s cubic-bezier(0.25, 1, 0.3, 1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header, footer {
            padding: 2% 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: lowercase;
            font-size: 13px;
            letter-spacing: 0.15em;
            font-weight: 300;
        }

        /* --- BOUTON SOMMAIRE --- */
        .menu-toggle {
            background: none; border: none; color: white;
            cursor: pointer; opacity: 0.6; transition: opacity 0.3s;
            display: flex; align-items: center; gap: 10px;
            text-transform: uppercase; font-size: 11px; letter-spacing: 0.2em;
            position: relative; z-index: 100;
        }
        .menu-toggle:hover { opacity: 1; }

        /* --- MENU OVERLAY --- */
        .menu-overlay {
            position: fixed; top: 0; left: -100%;
            width: 320px; height: 100%;
            background: rgba(11, 11, 11, 0.98);
            backdrop-filter: blur(15px);
            z-index: 2000;
            transition: left var(--transition-main);
            padding: 40px;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            overflow-y: auto;
        }
        .menu-overlay.active { left: 0; }
        
        .menu-header {
            display: flex; flex-direction: column; align-items: center;
            margin-bottom: 30px; padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }
        .menu-logo { width: 80px; margin-bottom: 15px; opacity: 0.9; }
        .menu-close {
            position: absolute; top: 25px; right: 25px;
            background: none; border: none; color: white;
            font-size: 30px; cursor: pointer; opacity: 0.5;
        }

        .menu-overlay ul { list-style: none; padding: 0; margin: 0; }
        .menu-section-title {
            font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase;
            color: var(--accent-color); margin: 25px 0 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px;
            display: block;
        }
        .menu-overlay li a {
            color: white; text-decoration: none; font-size: 15px;
            display: block; padding: 8px 0; transition: all 0.3s;
            font-weight: 300; opacity: 0.7;
        }
        .menu-overlay li a:hover, .menu-overlay li a.active-link { opacity: 1; transform: translateX(8px); }

        /* --- SLIDER --- */
        .swiper { width: 100%; flex-grow: 1; padding: 50px 0; }
        .swiper-slide {
            width: 50vw; display: flex; justify-content: center; align-items: center;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            opacity: 0.2; filter: grayscale(100%);
        }
        .swiper-slide-active { opacity: 1; filter: grayscale(0%); transform: scale(1.1); }
        .slide-content {
            width: 100%; background-color: var(--card-bg);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center;
        }
        .slide-content img { width: 100%; height: auto; display: block; opacity: 0; transition: opacity 0.5s; }
        .img-loaded img { opacity: 1; }

        /* --- NAVIGATION ICONS --- */
        .social-links { display: flex; gap: 20px; }
        .social-links a { color: white; font-size: 18px; opacity: 0.6; transition: 0.3s; }
        .social-links a:hover { opacity: 1; transform: translateY(-2px); }
        
        .arrow-icon { width: 60px; height: 1px; background: white; position: relative; cursor: pointer; }
        .arrow-icon::after {
            content: ''; position: absolute; right: 0; top: -3px;
            width: 6px; height: 6px; border-top: 1px solid white; border-right: 1px solid white;
            transform: rotate(45deg);
        }
        .arrow-left { transform: scaleX(-1); }
        .nav-controls { display: flex; align-items: center; gap: 20px; }

        @media (max-width: 768px) {
            .swiper-slide { width: 85vw; }
            .menu-overlay { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 30px;">
            <img width="60px" src="logo.png" alt="Manolo Raj Logo">
            <button class="menu-toggle" id="toggleBtn">
                <i class="fa-solid fa-list-ul"></i>
                <span>Sommaire</span>
            </button>
        </div>
        <nav class="social-links">
            <a href="https://www.behance.net/manolorajaonah" target="_blank" aria-label="Behance"><i class="fa-brands fa-behance"></i></a>

            <a href="mailto:manolo.rajaonah@gmail.com" aria-label="Email"><i class="fa-regular fa-envelope"></i></a>
        </nav>
    </header>

    <nav class="menu-overlay" id="menuOverlay">
        <button class="menu-close" aria-label="Fermer le menu">&times;</button>
        <div class="menu-header">
            <img src="logo.png" alt="Manolo Raj" class="menu-logo">
            <div style="font-size: 10px; letter-spacing: 0.3em; opacity: 0.5;">PORTFOLIO</div>
        </div>
        <ul id="menuList"></ul>
    </nav>

    <main class="swiper mySwiper">
        <div class="swiper-wrapper" id="slider-wrapper"></div>
    </main>

    <footer>
        <div>DESIGNER GRAPHIQUE & WEB</div>
        <nav class="nav-controls">
            <div class="arrow-icon arrow-left" id="prevBtn" role="button"></div>
            <div id="page-number">01 / 31</div>
            <div class="arrow-icon" id="nextBtn" role="button"></div>
        </nav>
        <div>&copy; 2026 Manolo Rajaonah | QC, Canada</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const CONFIG = {
            totalSlides: 31,
            baseImgPath: 'images/7cbfec2e-',
            menuItems: [
                { type: 'title', label: 'Mise en page' },
                { type: 'link', label: 'Armona', slide: 5 },
                { type: 'link', label: 'Pochette d’album', slide: 8 },
                { type: 'link', label: 'Jeu de cartes', slide: 12 },
                { type: 'title', label: 'Logos & Tattoos' },
                { type: 'link', label: 'Logofolio', slide: 15 },
                { type: 'link', label: 'Tattoofolio', slide: 18 },
                { type: 'title', label: 'Affiches' },
                { type: 'link', label: 'HIP HOP', slide: 21 },
                { type: 'link', label: 'Brasserie d’Alma', slide: 23 },
                { type: 'title', label: 'Web' },
                { type: 'link', label: 'Site Coiffure', slide: 26 },
                { type: 'link', label: 'UI/UX Épicerie', slide: 28 }
            ]
        };

        const wrapper = document.getElementById('slider-wrapper');
        const menuList = document.getElementById('menuList');
        const menuOverlay = document.getElementById('menuOverlay');
        const toggleBtn = document.getElementById('toggleBtn');

        // 1. GÉNÉRATION DES SLIDES
        const fragment = document.createDocumentFragment();
        for (let i = 1; i <= CONFIG.totalSlides; i++) {
            const index = i.toString().padStart(2, '0');
            const slide = document.createElement('div');
            slide.className = 'swiper-slide';
            slide.innerHTML = `
                <article class="slide-content">
                    <img src="${CONFIG.baseImgPath}${index}.png" 
                         alt="Projet de Design Manolo Raj - ${index}"
                         loading="lazy" 
                         onload="this.parentElement.classList.add('img-loaded')">
                </article>`;
            fragment.appendChild(slide);
        }
        wrapper.appendChild(fragment);

        // 2. GÉNÉRATION DU MENU
        CONFIG.menuItems.forEach(item => {
            const li = document.createElement('li');
            if (item.type === 'title') {
                li.className = 'menu-section-title';
                li.textContent = item.label;
            } else {
                const a = document.createElement('a');
                a.href = "javascript:void(0)";
                a.textContent = item.label;
                a.onclick = (e) => { e.preventDefault(); goToSlide(item.slide, a); };
                li.appendChild(a);
            }
            menuList.appendChild(li);
        });

        // 3. INITIALISATION SWIPER
        var swiper = new Swiper(".mySwiper", {
            effect: "coverflow",
            centeredSlides: true,
            slidesPerView: "auto",
            loop: true,
            speed: 900,
            mousewheel: true,
            keyboard: true,
            coverflowEffect: { rotate: 0, stretch: 0, depth: 150, modifier: 1, slideShadows: false },
            on: {
                slideChange: function () {
                    const current = (this.realIndex + 1).toString().padStart(2, '0');
                    const total = CONFIG.totalSlides.toString().padStart(2, '0');
                    document.getElementById('page-number').innerText = `${current} / ${total}`;
                },
                transitionEnd: function() {
                    if (window.isMenuNavigation) {
                        menuOverlay.classList.add('active');
                        window.isMenuNavigation = false;
                    }
                }
            }
        });

        // 4. NAVIGATION & EVENTS
        const toggleMenu = (e) => {
            if(e) e.stopPropagation();
            menuOverlay.classList.toggle('active');
        };

        toggleBtn.addEventListener('click', toggleMenu);
        document.querySelector('.menu-close').addEventListener('click', toggleMenu);
        document.getElementById('prevBtn').addEventListener('click', () => swiper.slidePrev());
        document.getElementById('nextBtn').addEventListener('click', () => swiper.slideNext());

        function goToSlide(number, element) {
            window.isMenuNavigation = true; 
            menuOverlay.classList.remove('active');
            
            document.querySelectorAll('#menuList a').forEach(l => l.classList.remove('active-link'));
            element.classList.add('active-link');

            setTimeout(() => {
                swiper.slideToLoop(number - 1);
            }, 150);
        }

        // Fermeture clic extérieur
        document.addEventListener('click', (e) => {
            if (menuOverlay.classList.contains('active') && !menuOverlay.contains(e.target) && !toggleBtn.contains(e.target)) {
                menuOverlay.classList.remove('active');
            }
        });
    </script>
</body>
